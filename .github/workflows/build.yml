name: Build

on:
  push:
    branches-ignore:
      - gh-readonly-queue/**
    paths-ignore:
      - 'CLIENT_TODO.md'
  pull_request:
    paths-ignore:
      - 'CLIENT_TODO.md'
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cmake:
    timeout-minutes: 35
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      CARGO_HTTP_MULTIPLEXING: false
    strategy:
      fail-fast: false
      matrix:
        name: [windows-latest-mingw]
        include:
        - name: windows-latest-mingw
          os: windows-latest
          cmake-args: -G Ninja -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DEXCEPTION_HANDLING=ON -DCMAKE_RC_COMPILER=windres -DCMAKE_AR=ar -DVULKAN=OFF
          cmake-init-env: CXXFLAGS=-Werror LDFLAGS=-Werror
          package-file: "*-win64.zip"
          executable-suffix: .exe
          workaround-issue10203-run-after-configure: rm libwinpthread-1.dll

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Prepare Linux
      if: contains(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update -y
        # mount: /var/lib/grub/esp: special device /dev/disk/by-id/scsi-... does not exist.
        # sudo apt-get upgrade -y
        packages=(
          # tidy-alphabetical-start
          gcovr
          libavcodec-dev
          libavformat-dev
          libavutil-dev
          libfreetype6-dev
          libglew-dev
          libnotify-dev
          libpng-dev
          libsdl2-dev
          libsqlite3-dev
          libswresample-dev
          libswscale-dev
          libx264-dev
          ninja-build
          pkg-config
          valgrind
          # tidy-alphabetical-end
        )
        sudo apt-get install -y "${packages[@]}"

    - name: Prepare Linux (non-fancy)
      if: contains(matrix.os, 'ubuntu') && !contains(matrix.name, 'fancy')
      run: |
        curl -LO https://github.com/Kitware/CMake/releases/download/v3.13.4/cmake-3.13.4-Linux-x86_64.tar.gz
        sudo tar --strip-components 1 -C /usr -xf cmake-3.13.4-Linux-x86_64.tar.gz
        # Our minimum supported Rust version (MSRV)
        rustup default 1.85.0
        sudo rm -rf /var/lib/mysql/ /var/run/mysqld
        sudo mkdir /var/lib/mysql/ /var/run/mysqld/
        sudo chown mysql:mysql /var/lib/mysql/ /var/run/mysqld/
        sudo mysqld --initialize-insecure --user=mysql --basedir=/usr --datadir=/var/lib/mysql/
        sudo /usr/bin/mysqld_safe --basedir=/usr --datadir='/var/lib/mysql/' &
        sleep 10
        sudo mysql <<EOF
        CREATE DATABASE ddnet;
        CREATE USER 'ddnet'@'localhost' IDENTIFIED BY 'thebestpassword';
        GRANT ALL PRIVILEGES ON ddnet.* TO 'ddnet'@'localhost';
        FLUSH PRIVILEGES;
        EOF

    - name: Prepare Linux (fancy)
      if: contains(matrix.os, 'ubuntu') && contains(matrix.name, 'fancy')
      run: |
        sudo apt-get install cmake libmariadb-dev libwebsockets-dev mariadb-server -y
        sudo systemctl start mariadb
        sudo mariadb --protocol=socket <<'EOF'
        CREATE DATABASE ddnet;
        CREATE USER 'ddnet'@'localhost' IDENTIFIED BY 'thebestpassword';
        GRANT ALL PRIVILEGES ON ddnet.* TO 'ddnet'@'localhost';
        FLUSH PRIVILEGES;
        EOF
        sudo mariadb --protocol=socket \
          -e "SELECT VERSION(), @@datadir, @@socket;"

    - name: Prepare macOS
      if: contains(matrix.os, 'macOS')
      run: |
        brew update
        brew install ffmpeg molten-vk ninja pkg-config sdl2
        brew upgrade freetype
        pip3 install --break-system-packages dmgbuild pyobjc-framework-Quartz
        echo /Library/Frameworks/Python.framework/Versions/3.12/bin >> $GITHUB_PATH
        sudo rm -rf /Library/Developer/CommandLineTools

    - name: Prepare Windows MinGW
      if: contains(matrix.os, 'windows') && contains(matrix.name, 'mingw')
      run: |
        rustup toolchain install stable-x86_64-pc-windows-gnu
        rustup target add x86_64-pc-windows-gnu
        rustup default stable-x86_64-pc-windows-gnu
        rustup set default-host x86_64-pc-windows-gnu

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2.9.2
      with:
          workspaces: |
              src/mastersrv
              src/masterping
              ./

    - name: Build mastersrv
      if: ${{ !contains(matrix.os, 'ubuntu-22.04') }}
      run: |
        cd src/mastersrv
        cargo build

    - name: Build masterping
      if: ${{ !contains(matrix.os, 'ubuntu-22.04') }}
      run: |
        cd src/masterping
        cargo build

    - name: Build in debug mode
      run: |
        mkdir debug
        cd debug
        ${{ matrix.cmake-path }}cmake --version
        ${{ matrix.cmake-path }}cmake -E env ${{ matrix.cmake-init-env }} ${{ matrix.cmake-path }}cmake ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=Debug -Wno-error=dev -DDOWNLOAD_GTEST=ON -DDEV=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_DEBUG=. ..
        ${{ matrix.workaround-issue10203-run-after-configure }}
        ${{ matrix.cmake-path }}cmake --build . --config Debug --target everything

    - name: Test debug
      run: |
        cd debug
        ${{ matrix.cmake-path }}cmake -E env ${{ matrix.gtest-env }} ${{ matrix.cmake-path }}cmake --build . --config Debug --target run_tests_verbose

    - name: Run debug server
      run: |
        cd debug
        ./DDNet-Server shutdown

    - name: Build in release mode
      run: |
        mkdir release
        cd release
        ${{ matrix.cmake-path }}cmake -E env ${{ matrix.cmake-init-env }} ${{ matrix.cmake-path }}cmake ${{ matrix.cmake-args }} ${{ matrix.cmake-args-release }} -DCMAKE_BUILD_TYPE=Release -Wno-error=dev -DDOWNLOAD_GTEST=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. ..
        ${{ matrix.workaround-issue10203-run-after-configure }}
        ${{ matrix.cmake-path }}cmake --build . --config Release --target everything

    - name: Test release
      run: |
        cd release
        ${{ matrix.cmake-path }}cmake -E env ${{ matrix.gtest-env }} ${{ matrix.cmake-path }}cmake --build . --config Release --target run_tests_verbose

    - name: Run release server
      run: |
        cd release
        ./DDNet-Server shutdown

    - name: Build headless client
      if: ${{ !contains(matrix.os, 'ubuntu') }}
      run: |
        mkdir headless
        cd headless
        ${{ matrix.cmake-path }}cmake -E env ${{ matrix.cmake-init-env }} ${{ matrix.cmake-path }}cmake ${{ matrix.cmake-args }} -DHEADLESS_CLIENT=ON -DCMAKE_BUILD_TYPE=Debug -Wno-error=dev -DDOWNLOAD_GTEST=ON -DDEV=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_DEBUG=. ..
        ${{ matrix.workaround-issue10203-run-after-configure }}
        ${{ matrix.cmake-path }}cmake --build . --config Debug

    - name: Build headless client with code coverage
      if: contains(matrix.os, 'ubuntu-latest')
      run: |
        mkdir headless
        cd headless
        ${{ matrix.cmake-path }}cmake -E env CXXFLAGS="--coverage -Werror" ${{ matrix.cmake-path }}cmake -E env LDFLAGS="--coverage -Werror" ${{ matrix.cmake-path }}cmake ${{ matrix.cmake-args }} -DHEADLESS_CLIENT=ON -DWEBSOCKETS=ON -DCMAKE_BUILD_TYPE=Debug -Wno-error=dev -DDOWNLOAD_GTEST=ON -DDEV=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_DEBUG=. ..
        ${{ matrix.workaround-issue10203-run-after-configure }}
        ${{ matrix.cmake-path }}cmake -E env RUSTFLAGS="-Clink-arg=--coverage" ${{ matrix.cmake-path }}cmake --build . --config Debug

    - name: Test headless client (unit tests)
      if: ${{ !contains(matrix.os, 'ubuntu') }}
      run: |
        cd headless
        ${{ matrix.cmake-path }}cmake --build . --config Debug --target run_tests_verbose

    - name: Test headless client (unit tests) with code coverage
      if: contains(matrix.os, 'ubuntu-latest')
      run: |
        cd headless
        ${{ matrix.cmake-path }}cmake -E env RUSTFLAGS="-Clink-arg=--coverage" RUSTDOCFLAGS="-Clink-arg=--coverage" ${{ matrix.cmake-path }}cmake --build . --config Debug --target run_tests_verbose

    - name: Upload Codecov report (unit tests)
      if: contains(matrix.os, 'ubuntu-latest')
      uses: codecov/codecov-action@v7
      with:
        flags: unittests

    - name: Build in release mode with debug info and all features on
      if: contains(matrix.name, 'fancy')
      run: |
        mkdir fancy
        cd fancy
        ${{ matrix.cmake-path }}cmake -E env ${{ matrix.cmake-init-env }} ${{ matrix.cmake-path }}cmake ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=RelWithDebInfo -DDOWNLOAD_GTEST=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. -DANTIBOT=ON -DWEBSOCKETS=ON ..
        ${{ matrix.workaround-issue10203-run-after-configure }}
        ${{ matrix.cmake-path }}cmake --build . --config RelWithDebInfo --target everything

    - name: Test fancy
      if: contains(matrix.name, 'fancy')
      run: |
        cd fancy
        ${{ matrix.cmake-path }}cmake -E env ${{ matrix.gtest-env }} ${{ matrix.cmake-path }}cmake --build . --config RelWithDebInfo --target run_tests_verbose

    - name: Run fancy server
      if: contains(matrix.name, 'fancy')
      run: |
        cd fancy
        ./DDNet-Server shutdown

    - name: Run integration tests
      id: integration_test
      if: ${{ !contains(matrix.os, 'ubuntu') }}
      continue-on-error: true
      run: |
        cp src/mastersrv/target/debug/mastersrv${{ matrix.executable-suffix }} headless
        python scripts/integration_test.py --show-full-output --test-mastersrv headless

    - name: Run integration tests with Valgrind's Memcheck and code coverage
      id: integration_test_valgrind
      if: contains(matrix.os, 'ubuntu-latest')
      continue-on-error: true
      run: |
        # Remove old coverage data:
        find headless -name '*.gcno' -o -name '*.gcda' -delete
        cp src/mastersrv/target/debug/mastersrv${{ matrix.executable-suffix }} headless
        python scripts/integration_test.py --show-full-output --test-mastersrv --test-websockets --valgrind-memcheck headless

    - name: Upload integration test results
      id: integration_test_artifact_upload
      if: steps.integration_test.outcome == 'failure' || steps.integration_test_valgrind.outcome == 'failure'
      uses: actions/upload-artifact@v6
      with:
        name: ddnet-${{ matrix.name }}-integration-test-results
        path: headless/integration_*
        if-no-files-found: error

    - name: Summarize integration test results
      if: steps.integration_test.outcome == 'failure' || steps.integration_test_valgrind.outcome == 'failure'
      shell: bash
      run: |
        echo -e "\033[31mFAILED: Integration test failed. Refer to the workflow logs and uploaded artifacts in the steps above for details.\033[m"
        echo "### Integration test failed" >> $GITHUB_STEP_SUMMARY
        echo >> $GITHUB_STEP_SUMMARY
        echo "See summary below. Refer to the workflow logs and uploaded artifacts for details." >> $GITHUB_STEP_SUMMARY
        echo >> $GITHUB_STEP_SUMMARY
        echo "Artifact URL: ${{ steps.integration_test_artifact_upload.outputs.artifact-url }}" >> $GITHUB_STEP_SUMMARY
        for integration_dir in headless/integration_*; do
          echo >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Test $(basename "$integration_dir")</summary>" >> $GITHUB_STEP_SUMMARY
          echo >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat "$integration_dir/test_failure.log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
        done
        exit 1

    - name: Upload Codecov report (integration tests)
      if: contains(matrix.os, 'ubuntu-latest')
      uses: codecov/codecov-action@v7
      with:
        flags: integrationtests

    - name: Install current MinGW pthread runtime
      if: contains(matrix.name, 'mingw')
      uses: msys2/setup-msys2@v2
      env:
        __SETUP_MSYS2_USE_MAIN_MIRROR_ONLY: "true"
      with:
        msystem: MINGW64
        update: true
        install: mingw-w64-x86_64-libwinpthread mingw-w64-x86_64-binutils

    - name: Copy and verify MinGW pthread runtime
      if: contains(matrix.name, 'mingw')
      shell: msys2 {0}
      run: |
        cp /mingw64/bin/libwinpthread-1.dll release/libwinpthread-1.dll
        objdump -p release/DDNet.exe > ddnet-imports.txt
        objdump -p release/libwinpthread-1.dll > pthread-exports.txt
        grep -q 'clock_gettime64' ddnet-imports.txt
        grep -q 'nanosleep64' ddnet-imports.txt
        grep -q 'clock_gettime64' pthread-exports.txt
        grep -q 'nanosleep64' pthread-exports.txt

    - name: Package
      run: |
        cd release
        ${{ matrix.cmake-path }}cmake --build . --config Release --target package_default
        mkdir artifacts
        mv ${{ matrix.package-file }} artifacts

    - name: Replace packaged MinGW pthread runtime
      if: contains(matrix.name, 'mingw')
      shell: pwsh
      run: |
        @'
        from pathlib import Path, PurePosixPath
        from zipfile import ZipFile

        archives = list(Path("release/artifacts").glob("*-win64.zip"))
        if len(archives) != 1:
            raise SystemExit(f"Expected one Windows package, found {len(archives)}")

        archive_path = archives[0]
        runtime_path = Path("release/libwinpthread-1.dll")
        if not runtime_path.is_file():
            raise SystemExit("Verified MinGW runtime DLL is missing")

        with ZipFile(archive_path, "r") as source:
            entries = source.infolist()
            dll_entries = [entry for entry in entries if PurePosixPath(entry.filename).name.lower() == "libwinpthread-1.dll"]
            exe_entries = [entry for entry in entries if PurePosixPath(entry.filename).name.lower() == "ddnet.exe"]
            if len(dll_entries) != 1 or len(exe_entries) != 1:
                raise SystemExit(f"Expected one DDNet.exe and one libwinpthread-1.dll, got {len(exe_entries)} and {len(dll_entries)}")

            replacement = runtime_path.read_bytes()
            temp_path = archive_path.with_name(archive_path.stem + ".runtime-fixed.zip")
            with ZipFile(temp_path, "w") as target:
                for entry in entries:
                    data = replacement if entry.filename == dll_entries[0].filename else source.read(entry.filename)
                    target.writestr(entry, data)

        temp_path.replace(archive_path)

        verify_dir = Path("release/verify")
        verify_dir.mkdir(parents=True, exist_ok=True)
        with ZipFile(archive_path, "r") as package:
            dll_name = next(name for name in package.namelist() if PurePosixPath(name).name.lower() == "libwinpthread-1.dll")
            exe_name = next(name for name in package.namelist() if PurePosixPath(name).name.lower() == "ddnet.exe")
            packaged_dll = package.read(dll_name)
            if packaged_dll != runtime_path.read_bytes():
                raise SystemExit("The packaged pthread DLL does not match the verified runtime DLL")
            (verify_dir / "libwinpthread-1.dll").write_bytes(packaged_dll)
            (verify_dir / "DDNet.exe").write_bytes(package.read(exe_name))
        '@ | python -

    - name: Verify pthread imports in final Windows package
      if: contains(matrix.name, 'mingw')
      shell: msys2 {0}
      run: |
        objdump -p release/verify/DDNet.exe > release/verify/ddnet-imports.txt
        objdump -p release/verify/libwinpthread-1.dll > release/verify/pthread-exports.txt
        grep -q 'clock_gettime64' release/verify/ddnet-imports.txt
        grep -q 'nanosleep64' release/verify/ddnet-imports.txt
        grep -q 'clock_gettime64' release/verify/pthread-exports.txt
        grep -q 'nanosleep64' release/verify/pthread-exports.txt

    - name: Put client files into Client 9 folder
      shell: pwsh
      run: |
        @'
        from pathlib import Path, PurePosixPath
        from shutil import copyfileobj, rmtree
        from zipfile import ZipFile

        artifacts = Path("release/artifacts")
        archives = list(artifacts.glob("*-win64.zip"))
        if len(archives) != 1:
            raise SystemExit(f"Expected one Windows package, found {len(archives)}")

        client_dir = artifacts / "Клиент 9"
        if client_dir.exists():
            rmtree(client_dir)
        client_dir.mkdir(parents=True)

        archive_path = archives[0]
        with ZipFile(archive_path, "r") as package:
            bad_file = package.testzip()
            if bad_file is not None:
                raise SystemExit(f"Windows package is corrupted: {bad_file}")

            entries = [entry for entry in package.infolist() if entry.filename]
            parsed = []
            top_levels = set()
            all_files_have_parent = True
            for entry in entries:
                if "\\" in entry.filename:
                    raise SystemExit(f"Unexpected path separator in package entry: {entry.filename}")
                path = PurePosixPath(entry.filename)
                if path.is_absolute() or ".." in path.parts:
                    raise SystemExit(f"Unsafe path in package entry: {entry.filename}")
                if path.parts:
                    top_levels.add(path.parts[0])
                if not entry.is_dir() and len(path.parts) < 2:
                    all_files_have_parent = False
                parsed.append((entry, path))

            strip_root = next(iter(top_levels)) if len(top_levels) == 1 and all_files_have_parent else None
            for entry, path in parsed:
                parts = path.parts[1:] if strip_root else path.parts
                if not parts:
                    continue
                destination = client_dir.joinpath(*parts)
                if entry.is_dir():
                    destination.mkdir(parents=True, exist_ok=True)
                else:
                    destination.parent.mkdir(parents=True, exist_ok=True)
                    with package.open(entry, "r") as source, destination.open("wb") as target:
                        copyfileobj(source, target)

        executables = [path for path in client_dir.rglob("DDNet.exe") if path.is_file()]
        runtimes = [path for path in client_dir.rglob("libwinpthread-1.dll") if path.is_file()]
        if len(executables) != 1 or len(runtimes) != 1:
            raise SystemExit(f"Client 9 package is incomplete: DDNet.exe={len(executables)}, libwinpthread-1.dll={len(runtimes)}")

        archive_path.unlink()
        print("Prepared Client 9 package")
        '@ | python -

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: Клиент 9
        path: release/artifacts

    - name: Create public Actions artifact mirror
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      shell: pwsh
      run: |
        @'
        from pathlib import Path, PurePosixPath
        from zipfile import ZIP_DEFLATED, ZipFile

        source_dir = Path("release/artifacts")
        output_path = Path("release/Клиент 9.zip")
        files = sorted(path for path in source_dir.rglob("*") if path.is_file())
        if not files:
            raise SystemExit("No packaged Windows build was found")

        output_path.parent.mkdir(parents=True, exist_ok=True)
        with ZipFile(output_path, "w", ZIP_DEFLATED) as archive:
            for path in files:
                archive.write(path, path.relative_to(source_dir).as_posix())

        with ZipFile(output_path, "r") as archive:
            bad_file = archive.testzip()
            if bad_file is not None:
                raise SystemExit(f"Public artifact ZIP is corrupted: {bad_file}")
            client_files = [name for name in archive.namelist() if name.startswith("Клиент 9/") and not name.endswith("/")]
            executables = [name for name in client_files if PurePosixPath(name).name.lower() == "ddnet.exe"]
            if not client_files or len(executables) != 1:
                raise SystemExit(f"Expected a complete Client 9 folder with one DDNet.exe, found {len(executables)} executables")
        print("Created public Windows mirror")
        '@ | python -

    - name: Publish latest Windows build on GitHub Releases
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: windows-latest
        name: Latest Windows x64 client
        body: |
          Automatically updated Windows x64 build from the master branch.

          Direct Actions artifact mirror: Клиент 9.zip
          The archive contains the Windows client files in a folder named `Клиент 9`.
        target_commitish: ${{ github.sha }}
        prerelease: true
        overwrite_files: true
        fail_on_unmatched_files: true
        files: |
          release/Клиент 9.zip

  build-android:
    if: false # This fork currently builds the Windows desktop client only.
    runs-on: ubuntu-24.04
    env:
      CARGO_HTTP_MULTIPLEXING: false
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v5

    - name: Prepare Linux
      run: |
        sudo apt-get update -y
        sudo apt-get install ninja-build openjdk-21-jdk openssl
        curl -LO https://github.com/Kitware/CMake/releases/download/v3.22.1/cmake-3.22.1-Linux-x86_64.tar.gz
        mkdir -p /home/runner/cmake
        tar --strip-components 1 -C /home/runner/cmake -xf cmake-3.22.1-Linux-x86_64.tar.gz
        rustup default 1.92.0
        cargo install cargo-ndk
        rustup target add armv7-linux-androideabi
        rustup target add i686-linux-android
        rustup target add aarch64-linux-android
        rustup target add x86_64-linux-android
        scripts/android/download_android_sdk.sh /home/runner

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2.9.2
      with:
          workspaces: |
              src/mastersrv
              src/masterping
              ./

    - name: Build Android app
      env:
        TW_KEY_NAME: /home/runner/DDNet.jks
        TW_KEY_ALIAS: DDNet-Key
      run: |
        export TW_KEY_PW="$(openssl rand -base64 32)"
        keytool -genkey -v -keystore "$TW_KEY_NAME" -keyalg RSA -keysize 2048 -validity 10000 -alias "$TW_KEY_ALIAS" -storepass "$TW_KEY_PW" -dname "CN=DDNet CI, OU=DDNet, O=DDNet"
        export ANDROID_HOME="/home/runner/Android/Sdk"
        unset ANDROID_SDK_ROOT
        export PATH=/home/runner/cmake/bin:$PATH
        scripts/android/cmake_android.sh all DDNet org.ddnet.client Release build-android
        mkdir artifacts
        mv build-android/DDNet.apk artifacts

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ddnet-android
        path: artifacts

  build-emscripten:
    if: false # This fork currently builds the Windows desktop client only.
    runs-on: ubuntu-24.04
    env:
      CARGO_HTTP_MULTIPLEXING: false
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Prepare Linux
      run: |
        curl -LO https://github.com/Kitware/CMake/releases/download/v3.22.1/cmake-3.22.1-Linux-x86_64.tar.gz
        mkdir -p /home/runner/cmake
        tar --strip-components 1 -C /home/runner/cmake -xf cmake-3.22.1-Linux-x86_64.tar.gz
        rustup default 1.89.0
        rustup target add wasm32-unknown-emscripten
        git clone https://github.com/emscripten-core/emsdk emsdk
        cd emsdk
        ./emsdk install 4.0.22
        ./emsdk activate 4.0.22

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2.9.2
      with:
          workspaces: |
              src/mastersrv
              src/masterping
              ./

    - name: Build headless Emscripten client in debug mode
      run: |
        export PATH=/home/runner/cmake/bin:$PATH
        source emsdk/emsdk_env.sh
        emcmake cmake -H. -G "Unix Makefiles" -B build-emscripten-headless -DCMAKE_BUILD_TYPE=Debug -DVIDEORECORDER=OFF -DVULKAN=OFF -DSERVER=OFF -DTOOLS=OFF -DHEADLESS_CLIENT=ON -DPREFER_BUNDLED_LIBS=ON
        cmake --build build-emscripten-headless --target game-client -j$(nproc)

    - name: Test headless Emscripten client
      run: |
        source emsdk/emsdk_env.sh
        emrun \
          --browser firefox \
          --browser-args=-headless \
          --port 8000 \
          --silence_timeout=120 \
          --timeout=300 \
          --kill_start \
          --kill_exit \
          build-emscripten-headless/index.html -- "quit" "#__emrun_autostart__"

    - name: Build Emscripten client in release mode
      run: |
        export PATH=/home/runner/cmake/bin:$PATH
        source emsdk/emsdk_env.sh
        # -G "Unix Makefiles" required due to https://gitlab.kitware.com/cmake/cmake/-/issues/16395
        emcmake cmake -H. -G "Unix Makefiles" -B build-emscripten-release -DCMAKE_BUILD_TYPE=Release -DVIDEORECORDER=OFF -DVULKAN=OFF -DSERVER=OFF -DTOOLS=OFF -DPREFER_BUNDLED_LIBS=ON
        cmake --build build-emscripten-release --target game-client -j$(nproc)
        cmake --build build-emscripten-release --target package_default
        mkdir artifacts
        mv build-emscripten-release/*-Emscripten.tar.xz artifacts

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ddnet-emscripten
        path: artifacts

  build-ios:
    if: false # This fork currently builds the Windows desktop client only.
    runs-on: macos-26
    env:
      CARGO_HTTP_MULTIPLEXING: false
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Prepare macOS
      run: |
        sudo xcode-select -s "/Applications/Xcode_26.2.app/Contents/Developer"
        xcodebuild -version
        rustup target add aarch64-apple-ios
        rustup target add aarch64-apple-ios-sim

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2.9.2
      with:
          workspaces: ./

    - name: Build iOS simulator app in debug mode
      run: scripts/ios/cmake_ios.sh sim-arm64 DDNet org.ddnet.client Debug build-ios-sim

    - name: Smoke test iOS simulator app in debug mode
      timeout-minutes: 15
      run: |
        UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(device["udid"] for devices in json.load(sys.stdin)["devices"].values() for device in devices if "iPhone" in device["name"]))')
        xcrun simctl bootstatus "$UDID" -b
        xcrun simctl install "$UDID" build-ios-sim/Debug-iphonesimulator/DDNet.app
        xcrun simctl launch --console-pty "$UDID" org.ddnet.client quit > simulator-console.log 2>&1
        cat simulator-console.log
        grep -q "config: saved to settings_ddnet.cfg" simulator-console.log

    - name: Build iOS device app in release mode
      run: scripts/ios/cmake_ios.sh device DDNet org.ddnet.client Release build-ios-device

    - name: Package
      run: |
        mkdir artifacts
        # Zip the app bundles, as the artifact upload does not keep the executable bit.
        cd build-ios-sim/Debug-iphonesimulator
        zip -qry ../../artifacts/DDNet-simulator.zip DDNet.app
        cd ../..
        # The app is unsigned, so it has to be signed before it can be installed.
        mkdir Payload
        mv build-ios-device/Release-iphoneos/DDNet.app Payload
        zip -qry artifacts/DDNet.ipa Payload

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ddnet-ios
        path: artifacts
